<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="text-center">

  <div class="container mt-4">

    <h1>Rock Paper Scissors</h1>

    <div class="row mt-3">
      <div class="col">
        <p>You: <span id="playerScore">0</span></p>
      </div>
      <div class="col">
        <p>Computer: <span id="computerScore">0</span></p>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col">
        <p>You: <span id="playerChoice">None</span></p>
      </div>
      <div class="col">
        <p>Computer: <span id="computerChoice">None</span></p>
      </div>
    </div>

    <h3 id="result">Make your move</h3>

    <div class="mt-3">
      <button id="rockBtn" class="btn btn-primary">Rock</button>
      <button id="paperBtn" class="btn btn-success">Paper</button>
      <button id="scissorsBtn" class="btn btn-danger">Scissors</button>
    </div>

    <div class="mt-3">
      <button id="resetBtn" class="btn btn-warning">Restart</button>
    </div>

  </div>

  <script src="java.js"></script>
</body>
</html>
