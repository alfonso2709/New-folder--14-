<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-center">

  <div class="container mt-4">

    <h1>Rock Paper Scissors</h1>

    <div class="row mt-3">
      <div class="col">
        <p>Results: <span id="result">0</span></p>
      </div>
      <div class="col">
        <p>Draft: <span id="outcome">0</span></p>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col">
        <p>Your Score: <span id="playerScore">None</span></p>
      </div>
      <div class="col">
        <p>Computer Score: <span id="computerScore">None</span></p>
      </div>
    </div>

    <h3 id="result">Make your move</h3>

<div class="button-group">

  <button id="rock">
    <span class="box">Rock</span>
  </button>

  <button id="paper">
    <span class="box">Paper</span>
  </button>

  <button id="scissors">
    <span class="box">Scissors</span>
  </button>

</div>

<div class="button-group">

  <button id="reset">
    <span class="box">Restart</span>
  </button>

</div>
    <div class="mt-2">
      <button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#instructionsModal">
        Show Instructions
      </button>
    </div>

  </div>

  <div class="modal fade" id="instructionsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">How to Play Rock Paper Scissors</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          Rock beats Scissors, Scissors beats Paper, and Paper beats Rock.
          Choose a move and try to beat the computer!
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your JS -->
  <script src="java.js"></script>

</body>
</html>
